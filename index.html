        async function fetchMersinPrayerTimes() {
            const loadingEl = document.getElementById('prayer-times-loading');
            const containerEl = document.getElementById('prayer-times-container');
            const cardsEl = document.getElementById('prayer-times-cards');
            const dateSubEl = document.getElementById('prayer-today-date');

            if (!loadingEl || !cardsEl) return;

            try {
                const res = await fetch(`https://api.aladhan.com/v1/calendar?latitude=36.8121&longitude=34.6415&method=13`);
                const data = await res.json();

                if (data.code === 200 && data.data) {
                    const todayIndex = new Date().getDate() - 1;
                    const todayData = data.data[todayIndex] || data.data[0];
                    const dateStr = todayData.date.gregorian.date;
                    const timings = todayData.timings;

                    if (dateSubEl) {
                        dateSubEl.textContent = `Bugün (${dateStr}) - Ezan Vakitleri`;
                    }

                    const timesList = [
                        { name: 'İmsak', time: timings.Fajr.split(' ')[0], icon: '🌅' },
                        { name: 'Güneş', time: timings.Sunrise.split(' ')[0], icon: '☀️' },
                        { name: 'Öğle', time: timings.Dhuhr.split(' ')[0], icon: '🌤️' },
                        { name: 'İkindi', time: timings.Asr.split(' ')[0], icon: '🌥️' },
                        { name: 'Akşam', time: timings.Maghrib.split(' ')[0], icon: '🌙' },
                        { name: 'Yatsı', time: timings.Isha.split(' ')[0], icon: '🌌' }
                    ];

                    cardsEl.innerHTML = timesList.map(t => `
                        <div class="bg-cream border border-cream-border rounded-xl p-2 sm:p-3 text-center space-y-0.5 shadow-2xs hover:border-theme-accent transition">
                            <span class="text-sm sm:text-lg block">${t.icon}</span>
                            <span class="text-[9px] sm:text-[11px] font-bold text-theme-accent block">${t.name}</span>
                            <span class="text-xs sm:text-sm font-extrabold text-theme-text block">${t.time}</span>
                        </div>
                    `).join('');

                    loadingEl.classList.add('hidden');
                    containerEl.classList.remove('hidden');
                } else {
                    throw new Error("Veri formatı uyumsuz");
                }
            } catch (err) {
                loadingEl.innerHTML = `<p class="text-xs text-rose-600 font-semibold">Namaz vakitleri alınamadı.</p>`;
            }
        }

            await selectSurah(surahId);
            setTimeout(() => {

                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    setTimeout(() => el.classList.remove('ring-2', 'ring-theme-accent'), 2500);
                }
            }, 500);

        async function loadSurah(id) {
            const contentArea = document.getElementById('content-area');
            const surahInfo = ALL_SURAHS.find(s => s.id === id);

            contentArea.innerHTML = `
                <div class="text-center py-16 space-y-3">
                    <div class="w-8 h-8 border-2 border-theme-accent border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs text-theme-muted font-semibold">${surahInfo.name} Suresi Yükleniyor...</p>
                </div>
            `;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/tr.diyanet`);
                const data = await res.json();

                if (data.code === 200 && data.data.ayahs) {
                    // Ayetlerin mükerrer/tekrar eden kayıtlarını önlemek için Map kullanımı
                    const uniqueAyahsMap = new Map();
                    data.data.ayahs.forEach(a => {
                        if (!uniqueAyahsMap.has(a.numberInSurah)) {
                            uniqueAyahsMap.set(a.numberInSurah, {
                                num: a.numberInSurah,
                                tr: a.text
                            });
                        }
                    });
                    currentAyahs = Array.from(uniqueAyahsMap.values());
                    renderAyahs(surahInfo, currentAyahs);
                } else {
                    throw new Error("Veri Alınamadı");
                }
            } catch (err) {
                currentAyahs = Array.from({ length: surahInfo.count }, (_, i) => ({
                    num: i + 1,
                    tr: `${surahInfo.name} Suresi ${i + 1}. Ayet meali yükleniyor.`
                }));
                renderAyahs(surahInfo, currentAyahs);
            }
        }

        function renderAyahs(surahInfo, ayahs) {
            const contentArea = document.getElementById('content-area');
            
            // Çift basımı önlemek için ayet listesini ayet numarasına göre Benzersizleştir (Deduplicate)
            const seenNumbers = new Set();
            const deduplicatedAyahs = ayahs.filter(a => {
                if (seenNumbers.has(a.num)) {
                    return false;
                }
                seenNumbers.add(a.num);
                return true;
            });
            
            let html = `
                <div class="bg-white border border-cream-border rounded-2xl p-4 sm:p-6 text-center shadow-xs text-theme-text">
                    <span class="inline-block px-3 py-1 bg-cream border border-cream-border rounded-full text-xs font-semibold text-theme-accent mb-2">
                        Toplam ${surahInfo.count} Ayet
                    </span>
                    <h2 class="text-xl sm:text-3xl font-bold text-theme-accent tracking-wide">
                        ${surahInfo.name} Suresi
                    </h2>
                </div>
            `;

            if (surahInfo.id !== 9) {
                html += `
                    <div class="text-center my-3 py-2.5 px-4 bg-white/80 border-y border-cream-border rounded-xl shadow-2xs">
                        <p class="text-sm sm:text-lg text-theme-accent font-semibold tracking-wide">
                            Rahmân ve Rahîm olan Allah'ın adıyla
                        </p>
                    </div>
                `;
            }

            html += `<div class="space-y-4">`;

            deduplicatedAyahs.forEach(a => {
                const isFav = favorites.some(f => f.surahId === surahInfo.id && f.ayahNum === a.num);

                html += `
                    <div id="ayah-${a.num}" class="bg-white border border-cream-border hover:border-theme-accent/50 shadow-2xs rounded-2xl p-4 sm:p-5 transition space-y-3">
                        <div class="flex flex-wrap items-center justify-between border-b border-cream-border pb-2.5 text-xs gap-2">
                            <div class="flex items-center space-x-2">
                                <span class="w-7 h-7 rounded-full bg-cream border border-cream-border text-theme-accent font-bold flex items-center justify-center text-xs shadow-2xs">
                                    ${a.num}
                                </span>
                                <span class="text-theme-accent font-semibold text-xs sm:text-sm">${surahInfo.name} Suresi, ${a.num}. Ayet</span>
                            </div>

                            <div class="flex items-center space-x-1.5 flex-wrap gap-1">
                                <button id="audio-btn-${surahInfo.id}-${a.num}" onclick="playAudio(${surahInfo.id}, ${a.num})" class="px-2.5 py-1.5 rounded-xl bg-cream border border-cream-border text-theme-accent hover:bg-theme-accent hover:text-white font-semibold transition custom-btn-text shadow-2xs active:scale-95">
                                    ▶️ Dinle
                                </button>
                                <button onclick="showTafsir(${surahInfo.id}, ${a.num}, '${surahInfo.name}')" class="px-2.5 py-1.5 rounded-xl bg-cream border border-cream-border text-theme-muted hover:text-theme-accent custom-btn-text font-medium active:scale-95">
                                    📖 Tefsir
                                </button>
                                <button onclick="toggleFavorite(${surahInfo.id}, ${a.num}, '${surahInfo.name}', \`${a.tr.replace(/`/g, '')}\`)" class="px-2.5 py-1.5 rounded-xl ${isFav ? 'bg-theme-accent text-white font-bold border border-theme-accent shadow-2xs' : 'bg-cream border border-cream-border text-theme-accent hover:bg-theme-accent hover:text-white'} font-semibold transition custom-btn-text active:scale-95">
                                    ${isFav ? '★ Favorilerde' : '★ Favorilere Ekle'}
                                </button>
                            </div>
                        </div>

                        <div class="bg-cream/50 border-l-4 border-theme-accent p-3.5 sm:p-4 rounded-r-xl text-theme-text leading-relaxed">
                            <span class="block text-[11px] text-theme-muted mb-1 font-semibold">Türkçe Meali</span>
                            <p class="meal-text transition-all text-theme-text leading-relaxed text-sm sm:text-base">
                                ${a.tr}
                            </p>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }

        function playAudio(surahId, ayahNum) {
            const key = `${surahId}-${ayahNum}`;
            const btn = document.getElementById(`audio-btn-${key}`);

            if (currentAudio && currentAudioKey === key) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    if (btn) btn.innerHTML = '⏸ Duraklat';
                } else {
                    currentAudio.pause();
                    if (btn) btn.innerHTML = '▶️ Dinle';
                }
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                if (currentAudioKey) {
                    const oldBtn = document.getElementById(`audio-btn-${currentAudioKey}`);
                    if (oldBtn) oldBtn.innerHTML = '▶️ Dinle';
                }
            }

            let globalAyah = 0;
            for (let i = 0; i < surahId - 1; i++) {
                globalAyah += ALL_SURAHS[i].count;
            }
            globalAyah += ayahNum;

            const url = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyah}.mp3`;
            currentAudio = new Audio(url);
            currentAudioKey = key;

            if (btn) btn.innerHTML = '⏳ Yükleniyor...';

            currentAudio.play().then(() => {
                if (btn) btn.innerHTML = '⏸ Duraklat';
            }).catch(() => {
                if (btn) btn.innerHTML = '⚠️ Hata';
            });

            currentAudio.onended = () => {
                if (btn) btn.innerHTML = '▶️ Dinle';
                currentAudioKey = null;
            };
        }

        function toggleFavorite(surahId, ayahNum, surahName, trText) {
            const idx = favorites.findIndex(f => f.surahId === surahId && f.ayahNum === ayahNum);
            if (idx >= 0) {
                favorites.splice(idx, 1);
            } else {
                favorites.push({ surahId, ayahNum, surahName, trText });
            }
            localStorage.setItem('quran_favs', JSON.stringify(favorites));

            if (showingFavs) {
                renderFavoritesView();
            } else if (currentSurahId) {
                const sInfo = ALL_SURAHS.find(s => s.id === surahId);
                renderAyahs(sInfo, currentAyahs);
            }
        }

        function showTafsir(surahId, ayahNum, surahName) {

            setTimeout(() => {
                body.innerHTML = `
                    <div class="space-y-3">
                        <p class="font-semibold text-theme-accent text-sm sm:text-base">Ayet Özeti ve İlahî Hikmet:</p>
                        <p class="text-xs sm:text-sm text-theme-text leading-relaxed">Bu ayet-i kerimede Yüce Allah, kullarına hidayet yolunu, imanın esaslarını, sabrı, namazı ve dünya ile ahiret dengesini gözetmenin önemini hatırlatmaktadır.</p>
                        <p class="text-[11px] text-theme-muted border-t border-cream-border pt-3">
                            * İlgili tefsir metni Diyanet Kur'an Kitaplığı kaynakları esas alınarak sunulmuştur.
                        </p>
                    </div>
                `;
            }, 250);
        }

        function closeTafsirModal() {
            document.getElementById('tafsir-modal')?.classList.add('hidden');
        }

        function handleGlobalSearch(query) {
            const clearBtn = document.getElementById('clear-global-search');
            const q = query.trim().toLowerCase();

            if (!q) {
                clearBtn?.classList.add('hidden');
                if (isHomeView) loadHomeView();
                else if (currentSurahId) loadSurah(currentSurahId);
                return;
            }

            clearBtn?.classList.remove('hidden');

            if (currentAyahs.length === 0) {
                return;
            }

            const matched = currentAyahs.filter(a => a.tr.toLowerCase().includes(q));
            const sInfo = ALL_SURAHS.find(s => s.id === currentSurahId) || { name: 'Arama Sonuçları', id: 0, count: matched.length };

            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="bg-white border border-cream-border rounded-2xl p-5 text-center shadow-xs text-theme-text">
                    <h2 class="text-lg font-bold text-theme-accent">Arama Sonuçları (${matched.length})</h2>
                    <p class="text-xs text-theme-muted font-medium mt-1">"${query}" ifadesi içeren ayetler listeleniyor.</p>
                </div>
            `;

            renderAyahs(sInfo, matched);
        }

        function clearSearch() {
            const searchInput = document.getElementById('global-search-input');
            if (searchInput) searchInput.value = '';
            handleGlobalSearch('');
        }
    </script>
</body>
</html>
