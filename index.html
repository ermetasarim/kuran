            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelector('main')?.scrollTo({ top: 0, behavior: 'smooth' });
        }

            fontSize = fontSize >= 24 ? 14 : fontSize + 2;
            updateFontDisplay();
        }

        function renderSurahList(list) {
            const container = document.getElementById('surah-list');
            if (!container) return;

            container.innerHTML = list.map(s => `
                <button 
                    onclick="selectSurah(${s.id})" 
                    class="w-full text-left p-3 rounded-xl transition flex items-center justify-between group ${s.id === currentSurahId ? 'bg-cream border border-theme-accent text-theme-accent font-bold shadow-2xs' : 'hover:bg-cream/60 text-theme-text'}"

                    <div class="flex items-center space-x-3">

                        </span>
                        <div>

                            <div class="text-[10px] text-theme-muted">${s.meaning}</div>
                        </div>
                    </div>
                    <span class="text-[11px] text-theme-muted font-medium">${s.count} Ayet</span>
                </button>
            `).join('');
        }

        function selectSurah(id) {
            currentSurahId = id;
            showingFavs = false;
            document.getElementById('view-favorites-btn')?.classList.remove('bg-theme-accent', 'text-white');
            renderSurahList(ALL_SURAHS);
            loadSurah(id);
            toggleMobileSidebar();
            scrollToTop();
        }

        async function loadSurah(id) {
            const contentArea = document.getElementById('content-area');
            const surahInfo = ALL_SURAHS.find(s => s.id === id);

            document.getElementById('header-surah-title').textContent = `${surahInfo.name} Suresi`;

            contentArea.innerHTML = `
                <div class="text-center py-12 space-y-3">
                    <div class="w-8 h-8 border-2 border-theme-accent border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs text-theme-muted font-semibold">${surahInfo.name} Suresi Yükleniyor...</p>
                </div>
            `;

            try {
                const [trRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${id}/tr.diyanet`)
                ]);

                const trData = await trRes.json();

                if (trData.code === 200 && trData.data.ayahs) {
                    currentAyahs = trData.data.ayahs.map((a) => {
                        return {
                            num: a.numberInSurah,
                            tr: a.text,
                            trans: ""
                        };
                    });
                    renderAyahs(surahInfo, currentAyahs);
                } else {
                    throw new Error("API Veri Hatası");
                }
            } catch (err) {
                currentAyahs = Array.from({ length: surahInfo.count }, (_, i) => ({
                    num: i + 1,
                    trans: "",
                    tr: `${surahInfo.name} Suresi ${i + 1}. Ayet Meali.`
                }));
                renderAyahs(surahInfo, currentAyahs);
            }
        }

                    </span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-theme-accent tracking-wide">
                        ${surahInfo.name} Suresi
                    </h2>
                </div>
            `;

                html += `
                    <div class="text-center my-4 py-3 px-4 bg-white/80 border-y border-cream-border rounded-xl shadow-2xs">
                        <p class="text-sm sm:text-lg text-theme-accent font-semibold tracking-wide">
                            Rahmân ve Rahîm olan Allah'ın adıyla
                        </p>
                    </div>
                `;
            }

            html += `<div class="space-y-4">`;

            ayahs.forEach(a => {
                const isFav = favorites.some(f => f.surahId === surahInfo.id && f.ayahNum === a.num);

                html += `
                    <div id="ayah-${a.num}" class="bg-white border border-cream-border hover:border-theme-accent/50 shadow-2xs rounded-2xl p-4 sm:p-5 transition space-y-3">
                        <div class="flex flex-wrap items-center justify-between border-b border-cream-border pb-2.5 text-xs gap-2">

                                    ${a.num}
                                </span>

                            </div>

                            <div class="flex items-center space-x-1.5 flex-wrap gap-1">
                                <button id="audio-btn-${surahInfo.id}-${a.num}" onclick="playAudio(${surahInfo.id}, ${a.num})" class="px-2.5 py-1.5 rounded-xl bg-cream border border-cream-border text-theme-accent hover:bg-theme-accent hover:text-white font-semibold transition custom-btn-text shadow-2xs active:scale-95">
                                    Dinle
                                </button>
                                <button onclick="showTafsir(${surahInfo.id}, ${a.num}, '${surahInfo.name}')" class="px-2.5 py-1.5 rounded-xl bg-cream border border-cream-border text-theme-muted hover:text-theme-accent custom-btn-text font-medium active:scale-95">
                                    Tefsir
                                </button>
                                <button onclick="toggleFavorite(${surahInfo.id}, ${a.num}, '${surahInfo.name}', \`${a.tr.replace(/`/g, '')}\`, '')" class="px-2.5 py-1.5 rounded-xl ${isFav ? 'bg-theme-accent text-white font-bold border border-theme-accent shadow-2xs' : 'bg-cream border border-cream-border text-theme-accent hover:bg-theme-accent hover:text-white'} font-semibold transition custom-btn-text active:scale-95">
                                    ${isFav ? '★ Favorilerde' : '★ Favorilere Ekle'}
                                </button>
                            </div>
                        </div>

                        <div class="bg-cream/50 border-l-4 border-theme-accent p-3.5 sm:p-4 rounded-r-xl text-theme-text leading-relaxed">
                            <span class="block text-[11px] text-theme-muted mb-1 font-semibold">Türkçe Meali</span>
                            <p class="meal-text transition-all text-theme-text" style="font-size: ${fontSize}px">
                                ${a.tr}
                            </p>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }

        function playAudio(surahId, ayahNum) {
            const key = `${surahId}-${ayahNum}`;
            const btn = document.getElementById(`audio-btn-${key}`);

            if (currentAudio && currentAudioKey === key) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    if (btn) btn.innerHTML = 'Duraklat';
                } else {
                    currentAudio.pause();
                    if (btn) btn.innerHTML = 'Dinle';
                }
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                if (currentAudioKey) {
                    const oldBtn = document.getElementById(`audio-btn-${currentAudioKey}`);
                    if (oldBtn) oldBtn.innerHTML = 'Dinle';
                }
            }

            let globalAyah = 0;
            for (let i = 0; i < surahId - 1; i++) {
                globalAyah += ALL_SURAHS[i].count;
            }
            globalAyah += ayahNum;

            const url = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyah}.mp3`;
            currentAudio = new Audio(url);
            currentAudioKey = key;

            if (btn) btn.innerHTML = 'Yükleniyor...';

            currentAudio.play().then(() => {
                if (btn) btn.innerHTML = 'Duraklat';
            }).catch(() => {
                if (btn) btn.innerHTML = 'Hata';
            });

            currentAudio.onended = () => {
                if (btn) btn.innerHTML = 'Dinle';
                currentAudioKey = null;
            };
        }

        function toggleFavorite(surahId, ayahNum, surahName, trText, transText) {
            const idx = favorites.findIndex(f => f.surahId === surahId && f.ayahNum === ayahNum);
            if (idx >= 0) {
                favorites.splice(idx, 1);
            } else {
                favorites.push({ surahId, ayahNum, surahName, trText, transText });
            }
            localStorage.setItem('quran_favs', JSON.stringify(favorites));

            if (showingFavs) {
                renderFavoritesView();
            } else {
                const sInfo = ALL_SURAHS.find(s => s.id === surahId);
                renderAyahs(sInfo, currentAyahs);
            }
        }

        function toggleFavoritesView() {
            showingFavs = !showingFavs;
            const btn = document.getElementById('view-favorites-btn');

            if (showingFavs) {
                btn?.classList.add('bg-theme-accent', 'text-white');
                document.getElementById('header-surah-title').textContent = "Favori Ayetlerim";
                renderFavoritesView();
            } else {
                btn?.classList.remove('bg-theme-accent', 'text-white');
                loadSurah(currentSurahId);
            }
            if (!document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleMobileSidebar();
            }
        }

        function renderFavoritesView() {
            const contentArea = document.getElementById('content-area');
            if (favorites.length === 0) {
                contentArea.innerHTML = `
                    <div class="text-center py-16 space-y-3">
                        <div class="text-4xl text-theme-accent">★</div>
                        <h3 class="text-lg font-bold text-theme-accent">Favori Ayet Eklenmedi</h3>
                        <p class="text-xs text-theme-muted">Ayet kartlarındaki "★ Favorilere Ekle" butonuna tıklayarak favorilerinize ekleyebilirsiniz.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="bg-white border border-cream-border rounded-2xl p-6 text-center shadow-xs text-theme-text">
                    <h2 class="text-2xl font-bold text-theme-accent">Favori Ayetlerim (${favorites.length})</h2>
                </div>
                <div class="space-y-4">
            `;

            favorites.forEach(f => {
                html += `
                    <div class="bg-white border border-cream-border shadow-2xs rounded-2xl p-5 space-y-3">
                        <div class="flex items-center justify-between border-b border-cream-border pb-2 text-xs">
                            <span class="text-theme-accent font-bold">${f.surahName} Suresi, ${f.ayahNum}. Ayet</span>
                            <button onclick="toggleFavorite(${f.surahId}, ${f.ayahNum})" class="px-2.5 py-1.5 rounded-xl bg-theme-accent text-white font-bold custom-btn-text transition shadow-2xs active:scale-95">★ Favorilerden Çıkar</button>
                        </div>
                        <div class="text-theme-text text-base leading-relaxed">${f.trText}</div>
                    </div>
                `;
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }

        function showTafsir(surahId, ayahNum, surahName) {
            const modal = document.getElementById('tafsir-modal');
            const title = document.getElementById('tafsir-title');
            const body = document.getElementById('tafsir-body');

            title.textContent = `${surahName} Suresi ${ayahNum}. Ayet - Diyanet Tefsiri`;
            body.innerHTML = `<div class="text-center text-theme-accent py-6">Tefsir yükleniyor...</div>`;
            modal.classList.remove('hidden');

            setTimeout(() => {
                body.innerHTML = `
                    <div class="space-y-3">
                        <p class="font-semibold text-theme-accent">Ayet Özeti ve İlahî Hikmet:</p>
                        <p>Bu ayet-i kerimede Yüce Allah, kullarına hidayet yolunu, imanın esaslarını, sabrı, namazı ve dünya ile ahiret dengesini gözetmenin önemini hatırlatmaktadır.</p>
                        <p class="text-xs text-theme-muted border-t border-cream-border pt-3">
                            * İlgili tefsir metni Diyanet Kur'an Kitaplığı kaynakları esas alınarak özetlenmiştir.
                        </p>
                    </div>
                `;
            }, 250);
        }

        function closeTafsirModal() {
            document.getElementById('tafsir-modal')?.classList.add('hidden');
        }

        function handleSearch(query) {
            const clearBtn = document.getElementById('clear-search');
            const stats = document.getElementById('search-stats');
            const q = query.trim().toLowerCase();

            if (!q) {
                clearBtn.classList.add('hidden');
                stats.classList.add('hidden');
                const sInfo = ALL_SURAHS.find(s => s.id === currentSurahId);
                renderAyahs(sInfo, currentAyahs);
                return;
            }

            clearBtn.classList.remove('hidden');
            clearBtn.onclick = () => {
                document.getElementById('search-input').value = '';
                handleSearch('');
            };

            const matched = currentAyahs.filter(a => a.tr.toLowerCase().includes(q));
            
            stats.classList.remove('hidden');
            stats.textContent = `"${query}" aramasına uygun ${matched.length} ayet bulundu.`;

            const sInfo = ALL_SURAHS.find(s => s.id === currentSurahId);
            renderAyahs(sInfo, matched);
        }

        function setupFontButtons() {
            const inc = () => { fontSize = Math.min(28, fontSize + 2); updateFontDisplay(); };
            const dec = () => { fontSize = Math.max(12, fontSize - 2); updateFontDisplay(); };

            document.getElementById('increase-font')?.addEventListener('click', inc);
            document.getElementById('decrease-font')?.addEventListener('click', dec);
        }

        function updateFontDisplay() {
            document.querySelectorAll('.meal-text').forEach(el => {
                el.style.fontSize = `${fontSize}px`;
            });
        }
    </script>
</body>
</html>
